# Roadmap §25 — Web Gzip/Brotli + Cache Header.
#
# Sample nginx config for serving the Flutter web release build
# (build/web_public or build/web_admin). Flutter already emits .gz and .br
# variants for main.dart.js and the CanvasKit/Skwasm wasm files; nginx serves
# them with these rules and caches hashed assets immutably.
#
# Root: point to the folder produced by `flutter build web --release`.

server {
    listen 80;
    server_name prompt-search.example.com;

    root /var/www/prompt-search/build/web_public;
    index index.html;

    # ---- Compression: brotli first (files are pre-compressed by Flutter) ----
    brotli on;
    brotli_types application/javascript application/wasm application/octet-stream;
    brotli_static on;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_types application/javascript application/wasm application/json text/css;

    # ---- Caching ----
    # Hashed build artifacts (main.dart.js, canvaskit/*.wasm, fonts) are
    # immutable: cache for a year, no revalidation.
    location ~* \.(js|wasm|otf|ttf|json)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        try_files $uri $uri$args =404;
    }

    # Flutter requires the hashed main.dart.js to never be re-fetched; index
    # itself is revalidated so new deployments roll out on the next visit.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Vary "Accept-Encoding";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Security headers (Sprint 13 hardening + Sprint 18 release) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: only enable after HTTPS is confirmed working (see docs/release/web.md).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy. The Flutter Web bootstrap needs 'unsafe-eval'
    # for the Dart2JS engine, 'unsafe-inline' for its injected styles, and
    # img-src must allow the Supabase storage domain. Tighten per your host.
    add_header Content-Security-Policy \
        "default-src 'self'; \
         script-src 'self' 'unsafe-eval'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: https://vlgofmudzynjrphwwadb.supabase.co; \
         font-src 'self' https://fonts.gstatic.com; \
         connect-src 'self' https://vlgofmudzynjrphwwadb.supabase.co; \
         frame-ancestors 'none'; \
         base-uri 'self'" always;

    # ---- Admin app (optional separate server block) ----
    # server {
    #     listen 443 ssl;
    #     server_name admin.prompt-search.example.com;
    #     root /var/www/prompt-search/build/web_admin;
    #     ... same caching + security headers, plus:
    #     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     # Optionally protect with basic auth in front of the app's own login.
    # }
}
